spring:
  datasource:
    # Set SPRING_DATASOURCE_URL, or link Railway Postgres (PGHOST/PGPORT/PGDATABASE are injected).
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${PGHOST}:${PGPORT:5432}/${PGDATABASE}?sslmode=require}
    username: ${DATABASE_USERNAME:${PGUSER}}
    password: ${DATABASE_PASSWORD:${PGPASSWORD:}}

applocker:
  environment: deploy
  public-base-url: ${PUBLIC_BASE_URL}